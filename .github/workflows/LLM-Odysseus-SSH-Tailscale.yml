name: Setup LLM Runner, Odysseus + Tailscale

on:
  workflow_dispatch:
    inputs:
      ollama_model:
        description: 'Choose a model from https://ollama.com/library'
        required: true
        default: 'llama3.1'
        type: string
      install_odysseus:
        description: 'Install Odysseus WebUI? (When you open http://<TAILSCALE_IP>:7000 in your browser and log into Odysseus, navigate to Settings > Providers / Local Models, set the URL endpoint to http://host.docker.internal:11434/v1 and it will instantly discover your active model.)'
        required: true
        default: true
        type: boolean


permissions:
  contents: read

jobs:
  setup-llm-runner:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      USERNAME: runner
      PASSWORD: runner
      TAILSCALE_HOSTNAME: gh-llm-${{ github.run_id }}
      MODEL: ${{ inputs.ollama_model }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner user has sudo + password
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install OpenSSH server & Tmux
        run: |
          echo ">>> Installing OpenSSH & Tmux..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server tmux
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Configure Auto-Attach for SSH
        run: |
          echo ">>> Adding tmux auto-attach to profile.d..."
          sudo tee /etc/profile.d/99-tmux-autoattach.sh > /dev/null << 'EOF'
          # Auto-attach to Ollama tmux session if connecting via SSH
          if [ -z "$TMUX" ] && [ -n "$SSH_CONNECTION" ]; then
              tmux attach-session -t llm_session 2>/dev/null || true
          fi
          EOF

      - name: Install Tailscale
        run: |
          echo ">>> Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      - name: Install & Configure Ollama
        run: |
          echo ">>> Installing dependencies..."
          sudo apt update -y -qq
          sudo apt install curl wget -y -qq
          
          echo ">>> Installing Ollama..."
          curl -sSL https://ollama.com/install.sh | sh
          
          echo ">>> Configuring Ollama host binding (0.0.0.0)..."
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          echo -e '[Service]\nEnvironment="OLLAMA_HOST=0.0.0.0"' | sudo tee /etc/systemd/system/ollama.service.d/override.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama

          echo ">>> Version Check:"
          ollama --version

      - name: Pull and Background Model
        run: |
          echo ">>> Pulling model: ${MODEL} (this may take a few minutes)..."
          ollama pull ${MODEL}

          echo ">>> Starting interactive session in tmux background..."
          sudo -u ${USERNAME} tmux new-session -d -s llm_session "ollama run ${MODEL}"

      - name: Install Odysseus
        if: ${{ inputs.install_odysseus == 'true' || inputs.install_odysseus == true }}
        run: |
          echo ">>> Cloning Odysseus repository..."
          git clone https://github.com/pewdiepie-archdaemon/odysseus.git
          cd odysseus
          cp .env.example .env
          
          echo ">>> Configuring Odysseus environment..."
          echo "APP_BIND=0.0.0.0" >> .env
          
          # Enables container-to-host gateway communication on Linux
          cat << 'EOF' > docker-compose.override.yml
          services:
            odysseus:
              extra_hosts:
                - "host.docker.internal:host-gateway"
          EOF
          
          echo ">>> Building and starting Odysseus (Docker)..."
          docker compose up -d --build
          
          echo ">>> Waiting for Odysseus to initialize..."
          sleep 15
          
          ODYSSEUS_PWD=$(docker compose logs odysseus | grep -i 'Temporary password' | awk '{print $NF}' | tail -n 1)
          if [ -z "$ODYSSEUS_PWD" ]; then
             ODYSSEUS_PWD="Could not extract. Run 'docker compose logs odysseus | grep -i password' via SSH."
          fi
          echo "ODYSSEUS_PWD=${ODYSSEUS_PWD}" >> $GITHUB_ENV

      - name: Show Connection Info
        run: |
          TAILSCALE_IP=$(tailscale ip -4 | head -n1)
          echo "=== SSH & LLM CONNECTION INFO ==="
          echo "IP: ${TAILSCALE_IP}"
          echo "USERNAME: ${USERNAME}"
          echo "PASSWORD: ${PASSWORD}"
          echo
          
          if [ "${{ inputs.install_odysseus }}" = "true" ]; then
            echo ">>> Odysseus WebUI Access:"
            echo "    URL: http://${TAILSCALE_IP}:7000"
            echo "    Admin Password: ${ODYSSEUS_PWD}"
            echo
            echo "    (In Odysseus settings, set local model endpoint to: http://host.docker.internal:11434/v1)"
            echo
          fi
          
          echo ">>> Connect via SSH (Ollama will auto-launch):"
          echo "    ssh -o StrictHostKeyChecking=no ${USERNAME}@${TAILSCALE_IP}"
          echo
          echo ">>> To detach from Ollama and use the terminal, press:"
          echo "    Ctrl+b, then d"
          echo
          echo ">>> To return to Ollama later, type:"
          echo "    tmux attach -t llm_session"
          echo
          echo ">>> Keeping runner alive..."
          tail -f /dev/null
