name: Setup SSH Runner + Tailscale + Mosh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-ssh-runner:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      USERNAME: runner
      TAILSCALE_HOSTNAME: gh-ssh-${{ github.run_id }}

    steps:
      - name: Install and harden OpenSSH server, mosh, tmux
        run: |
          test -n "${SSH_PUBLIC_KEY}" || { echo "SSH_PUBLIC_KEY secret is not set"; exit 1; }
          test -n "${TAILSCALE_AUTHKEY}" || { echo "TAILSCALE_AUTHKEY secret is not set"; exit 1; }

          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server mosh tmux

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SSH_PUBLIC_KEY}" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

          printf '%s\n' \
            'PasswordAuthentication no' \
            'KbdInteractiveAuthentication no' \
            'PermitRootLogin no' \
            'UseDNS no' \
            'GSSAPIAuthentication no' \
            | sudo tee /etc/ssh/sshd_config.d/99-hardening.conf

          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      - name: Show connection info
        run: |
          TAILSCALE_IP=$(tailscale ip -4 | head -n1)
          echo "=== CONNECTION INFO ==="
          echo "IP: ${TAILSCALE_IP}"
          echo "HOSTNAME: ${TAILSCALE_HOSTNAME}"
          echo "USERNAME: ${USERNAME}"
          echo
          echo ">>> Mosh:"
          echo "    mosh --ssh=\"ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\" ${USERNAME}@${TAILSCALE_IP}"
          echo ">>> Plain SSH:"
          echo "    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${USERNAME}@${TAILSCALE_IP}"

      - name: Keep runner alive
        run: sleep infinity
