name: Setup XFCE Runner + Tailscale + Rustdesk
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-gui-runner:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      USERNAME: runner
      PASSWORD: runner
      RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
      TAILSCALE_HOSTNAME: gh-xfce-${{ github.run_id }}
      DISPLAY: ":1"
    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner user has sudo
        run: |
          set -euo pipefail
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install XFCE + virtual display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies xvfb dbus-x11 x11-utils

      - name: Start virtual display + XFCE
        run: |
          set -euo pipefail
          Xvfb ${DISPLAY} -screen 0 1920x1080x24 &
          # wait for the X server socket instead of a flat sleep
          for i in $(seq 1 20); do
            xdpyinfo -display ${DISPLAY} >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display ${DISPLAY} >/dev/null 2>&1 || { echo "Xvfb never came up"; exit 1; }
          dbus-launch --exit-with-session startxfce4 &
          sleep 3
          echo "XFCE launched on ${DISPLAY}"

      - name: Install RustDesk client
        run: |
          set -euo pipefail
          CLIENT_URL="https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.deb"
          wget -q -O /tmp/rustdesk-client.deb "$CLIENT_URL"
          sudo dpkg -i /tmp/rustdesk-client.deb || sudo apt-get install -f -y

      - name: Install Tailscale
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"
          TS_IP=$(sudo tailscale ip -4)
          echo "TAILSCALE_IP=${TS_IP}" >> "$GITHUB_ENV"
          
      - name: Start RustDesk service
        run: |
          set -euo pipefail
          sudo systemctl enable --now rustdesk
          # poll until it's actually listening instead of assuming
          for i in $(seq 1 20); do
            sudo ss -tulnp | grep -q ':21118\|:21116' && break
            sleep 1
          done
          sudo ss -tulnp | grep -E ':2111[5-9]' || { echo "rustdesk is not listening on any expected port"; sudo journalctl -u rustdesk --no-pager -n 100; exit 1; }

      - name: Connection Info + Keep Alive
        run: |
          echo "=== FINAL CONNECTION INFO ==="
          echo "Connect via Tailscale IP (no public relay involved):"
          echo "  Tailscale IP: ${TAILSCALE_IP}"
          echo "  RustDesk password: ${RUSTDESK_PASSWORD}"
          echo
          echo "RustDesk ID (only useful if you're NOT on the tailnet):"
          echo "  ${RUSTDESK_ID}"
          echo
          echo "Keeping runner alive..."
          while true; do
            sleep 600
          done
