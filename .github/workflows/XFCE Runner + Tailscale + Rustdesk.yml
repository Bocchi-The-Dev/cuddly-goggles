name: Setup XFCE Runner + Tailscale + Rustdesk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-gui-runner:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      USERNAME: runner
      PASSWORD: runner
      TAILSCALE_HOSTNAME: gh-xfce-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner user has sudo
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install XFCE
        run: |
          echo ">>> Installing lightweight XFCE Desktop..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xfce4-goodies xorg dbus-x11

          echo "startxfce4" | sudo tee /home/${USERNAME}/.xsession
          sudo chown ${USERNAME}:${USERNAME} /home/${USERNAME}/.xsession

      - name: Install RustDesk SERVER (hbbs + hbbr)
        run: |
          echo ">>> Installing RustDesk SERVER (hbbs + hbbr)..."

          HBBS_URL="https://github.com/rustdesk/rustdesk-server/releases/download/1.1.16/rustdesk-server-hbbs_1.1.16_amd64.deb"
          HBBR_URL="https://github.com/rustdesk/rustdesk-server/releases/download/1.1.16/rustdesk-server-hbbr_1.1.16_amd64.deb"

          HBBS_DEB="/tmp/hbbs.deb"
          HBBR_DEB="/tmp/hbbr.deb"

          wget -O "$HBBS_DEB" "$HBBS_URL"
          wget -O "$HBBR_DEB" "$HBBR_URL"

          sudo dpkg -i "$HBBS_DEB" || sudo apt-get install -f -y
          sudo dpkg -i "$HBBR_DEB" || sudo apt-get install -f -y

          sudo systemctl enable rustdesk-hbbs
          sudo systemctl enable rustdesk-hbbr
          sudo systemctl start rustdesk-hbbs
          sudo systemctl start rustdesk-hbbr

          sleep 5

          SERVER_ID=$(sudo cat /var/lib/rustdesk-server/id_ed25519.pub | tr -d '[:space:]')
          echo "RUSTDESK_SERVER_ID=$SERVER_ID" >> "$GITHUB_ENV"


      - name: Install Tailscale + start rustdesk
        run: |
          echo ">>> Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"
          sudo tailscale ip -4

          sudo systemctl start rustdesk-hbbs
          sudo systemctl start rustdesk-hbbr

      - name: Connection Info + Keep Alive
        run: |
          echo "=== FINAL CONNECTION INFO ==="
          echo "USERNAME: ${USERNAME}"
          echo "PASSWORD: ${PASSWORD}"
          echo
          echo "Tailscale IPs:"
          sudo tailscale ip -4 || true
          echo
          echo "RustDesk Server ID:"
          echo "${RUSTDESK_SERVER_ID}"
          echo"
          echo ">>> Keeping runner alive..."
          while true; do
            sleep 600
          done

