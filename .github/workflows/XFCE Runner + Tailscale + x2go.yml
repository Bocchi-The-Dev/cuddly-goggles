name: Setup XFCE Runner + Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-gui-runner:
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_HOSTNAME: gh-xfce-${{ github.run_id }}
      USERNAME: runner
      PASSWORD: runner
      KASMVNC_VERSION: 1.5.1

    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner user has sudo + password auth
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install XFCE
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal dbus-x11

      - name: Install KasmVNC
        run: |
          wget -q "https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/kasmvncserver_resolute_${KASMVNC_VERSION}_amd64.deb" \
            -O /tmp/kasmvnc.deb
          sudo apt-get install -y /tmp/kasmvnc.deb
          sudo adduser ${USERNAME} ssl-cert

          # Set VNC password
          mkdir -p ~/.vnc
          echo "${PASSWORD}" | kasmvncpasswd -u ${USERNAME} -w -r

          # Start server on display :1, bind to all interfaces, port 8444
          vncserver :1 \
            -select-de xfce \
            -interface 0.0.0.0 \
            -websocketPort 8444 \
            -sslOnly 0

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      - name: Connection Info + Keep Alive
        run: |
          echo "=== CONNECTION INFO ==="
          echo "Open in browser: http://$(sudo tailscale ip -4):8444"
          echo "Username: ${USERNAME}"
          echo "Password: ${PASSWORD}"
          echo ">>> Keeping runner alive..."
          while true; do sleep 600; done