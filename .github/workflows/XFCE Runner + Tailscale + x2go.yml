name: Setup XFCE Runner + Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-gui-runner:
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_HOSTNAME: gh-xfce-${{ github.run_id }}
      USERNAME: runner
      PASSWORD: runner
      KASMVNC_VERSION: 1.5.1

    steps:
      - uses: actions/checkout@v4

      - name: Ensure sudo
        run: |
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install XFCE
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal dbus-x11

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      - name: Install and start KasmVNC
        run: |
          wget -q "https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/kasmvncserver_ubuntu_resolute_${KASMVNC_VERSION}_amd64.deb" \
            -O /tmp/kasmvnc.deb
          sudo apt-get install -y /tmp/kasmvnc.deb
          sudo usermod -aG ssl-cert "${USERNAME}"

          mkdir -p ~/.vnc
          printf '%s\n%s\n' "${PASSWORD}" "${PASSWORD}" | kasmvncpasswd -u "${USERNAME}" -w
          echo "exec startxfce4" > ~/.vnc/xstartup
          chmod +x ~/.vnc/xstartup

          TS_IP=$(tailscale ip -4)
          sg ssl-cert -c "vncserver :1 \
            -select-de xfce \
            -interface ${TS_IP} \
            -websocketPort 8444 \
            -sslOnly 0"

      - name: Connection info + keep alive
        run: |
          echo "=== CONNECTION INFO ==="
          echo "Open in browser: http://$(tailscale ip -4):8444"
          echo "Username: ${USERNAME}"
          echo "Password: ${PASSWORD}"
          while true; do sleep 600; done